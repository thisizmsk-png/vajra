name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Tools
        run: |
          command -v jq || { sudo apt-get update && sudo apt-get install -y jq; }
          python3 --version
          openssl version
          bash --version | head -1
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Install gate-web browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1 axe-core@4.14.0
          npx playwright install --with-deps chromium
      - name: Allow the Chromium sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run all suites (vitest and every tests/**/run-*.sh)
        env:
          CI: "true"
          # Feature PRs target an integration branch and do not carry manifest.json: stale entries warn on a pull_request whose
          # base is not main. Pushes to main and any pull_request into main stay strict, so main is never stale.
          VAJRA_MANIFEST_FRESH: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && 'warn' || '' }}
        run: bash tests/run-all.sh
      - name: Profile sampler unit tests
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s app/bench/profile
      - name: Build the UI (tauri::generate_context! needs app/ui/dist)
        if: runner.os == 'macOS'
        working-directory: app/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Clippy (Rust core, warnings are errors)
        # macOS only: the Tauri crate needs webkit2gtk system packages on Linux, which this job does not install.
        if: runner.os == 'macOS'
        working-directory: app/core
        run: cargo clippy --all-targets -- -D warnings

  # D7 (vajra-1 decision 2026-11-12): the REAL bundled engine installer runs only here, on a fresh runner with a temp
  # HOME and no secrets: install, check the marks, roll back. Agent sessions and local tests only ever use a fake one.
  engine-real-installer:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Build the UI (tauri::generate_context! needs app/ui/dist)
        working-directory: app/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Real installer, temp HOME, no secrets
        working-directory: app/core
        env:
          VAJRA_REAL_INSTALLER_CI: "1"
        run: |
          # The toolchain stays where the runner put it; only the tests see the empty temp HOME.
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$RUNNER_TEMP/engine-home"
          mkdir -p "$HOME" && chmod 700 "$HOME"
          test -z "$(ls -A "$HOME")"
          cargo test --lib real_installer -- --ignored --nocapture
