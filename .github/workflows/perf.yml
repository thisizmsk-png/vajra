name: perf

# Per-merge memory check for Vajra Desktop (H0). PRs: idle x3. Main: idle x3 plus a 10 minute growth slope.
# Blocking: the first macOS run measured idle at 170.9 MiB, so a regression fails the check.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/perf.yml"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ["app/**", ".github/workflows/perf.yml"]
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory:
    # A label change must not re-run the idle gate; only the postload job reacts to the "perf" label.
    if: github.event.action != 'labeled'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Gate unit tests
        run: |
          python3 -m unittest discover -s app/bench/ci
          python3 -m unittest discover -s app/bench/ade
      - name: Build the app
        working-directory: app/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          cd ../core
          ../ui/node_modules/.bin/tauri build --bundles app
      - name: The shipped bundle has no perf fixture
        run: |
          if grep -rl "fixture/.claude/worktrees" app/ui/dist; then echo "perf fixture leaked into the normal bundle"; exit 1; fi
      - name: Idle (3 launches)
        run: |
          BIN="$(ls -d app/core/target/release/bundle/macos/*.app | head -1)/Contents/MacOS/vajra-desktop"
          python3 app/bench/ci/measure.py idle "$BIN" idle.json
          echo "BIN=$BIN" >> "$GITHUB_ENV"
      - name: Growth (10 minutes, main only)
        if: github.event_name == 'push'
        run: python3 app/bench/ci/measure.py growth "$BIN" growth.json 10
      - name: Gate
        run: |
          if [ -f growth.json ]; then python3 app/bench/ci/gate.py app/bench/ci/baseline.json idle.json growth.json
          else python3 app/bench/ci/gate.py app/bench/ci/baseline.json idle.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf
          path: |
            idle.json
            growth.json

  # Typing lag with 5 agents streaming a fake load, keystroke to paint in the runner's real Chrome: p95 must be at or under
  # 50 ms (app/ui/scripts/typing-lag.mjs). Report-only for its first week (see the step). Measured 17-22 ms locally.
  # The jsdom test (app/ui/tests/typingLag.test.tsx) stays as a fast first check and is report-only (continue-on-error).
  typing-lag:
    if: github.event.action != 'labeled'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: app/ui
        run: npm ci --no-audit --no-fund
      - name: Typing lag, jsdom (report only)
        working-directory: app/ui
        continue-on-error: true
        env:
          VAJRA_LAG_GATE: "1"
        run: npx vitest run tests/typingLag.test.tsx
      # REPORT-ONLY until 2026-11-20. It checks what streaming ADDS at p95 over the idle control (budget 20 ms), not an
      # absolute figure: the runner's own rendering costs about 69 ms with nothing streaming. The first runner run (13 Nov)
      # added about 120 ms, so expect this to fail until the transcript's layout cost is fixed (see the profile step). Remove
      # continue-on-error from 20 Nov if a week of runs shows the delta is stable.
      - name: Typing lag gate, real browser
        working-directory: app/ui
        continue-on-error: true
        run: |
          npx vite build -c vite.lag.config.ts
          node scripts/typing-lag.mjs --gate --out "$RUNNER_TEMP/typing-lag.json"
          echo '### Typing lag (real Chrome, 5 agents streaming)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const r=require(process.argv[1]);delete r.keys_ms;console.log(JSON.stringify(r,null,1))' "$RUNNER_TEMP/typing-lag.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # Where the main thread's time goes on this runner, streaming against idle (Chrome's CPU profiler). Report only, always.
      - name: Typing lag profile (report only)
        working-directory: app/ui
        continue-on-error: true
        run: |
          node scripts/typing-lag.mjs --profile --out "$RUNNER_TEMP/typing-lag-profile.json"
          echo '### Typing lag profile: self time in ms, streaming vs idle' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const r=require(process.argv[1]);const m=new Map(r.top_self_time_idle.map(t=>[t.name,t.ms]));for(const t of r.top_self_time_streaming)console.log(String(t.ms).padStart(8),String(m.get(t.name)??"-").padStart(8),t.name)' "$RUNNER_TEMP/typing-lag-profile.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Post-load idle (a scripted 10,000-line stream, then idle at +2 and +10 minutes): a second build plus ~15 minutes, so it
  # does not run on every PR. It runs on push to main, nightly, on a PR that changes app/ui/** or app/bench/**, or when the
  # PR has the "perf" label. Reported only (warnings and the job summary); it never fails the check.
  postload:
    if: github.event.action != 'labeled' || github.event.label.name == 'perf'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          run=false
          case "$EVENT" in
            push|schedule) run=true ;;
            pull_request)
              case ",$LABELS," in *,perf,*) run=true ;; esac
              if git diff --name-only "$BASE"...HEAD | grep -qE '^app/(ui|bench)/'; then run=true; fi ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then
            echo "Post-load idle skipped: this PR changes nothing under app/ui or app/bench and has no 'perf' label." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.decide.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.decide.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Build the app with the perf fixture
        if: steps.decide.outputs.run == 'true'
        working-directory: app/ui
        run: |
          npm ci --no-audit --no-fund
          VITE_PERF_FIXTURE=1 npm run build
          cd ../core
          ../ui/node_modules/.bin/tauri build --bundles app
      - name: Post-load idle (reported, not gated)
        if: steps.decide.outputs.run == 'true'
        run: |
          BIN="$(ls -d app/core/target/release/bundle/macos/*.app | head -1)/Contents/MacOS/vajra-desktop"
          python3 app/bench/ci/measure.py postload "$BIN" postload.json
          python3 app/bench/ci/gate.py --post app/bench/ci/baseline.json postload.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.decide.outputs.run == 'true'
        with:
          name: perf-postload
          path: postload.json
