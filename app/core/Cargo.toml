[package]
name = "vajra-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Vajra Desktop: a local window onto Vajra runs and their crews"
license = "MIT"
publish = false
# The bin target is src/main.rs (owned by task t8); Cargo auto-discovers it.

[lib]
name = "vajra_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in Cargo.lock through the Tauri build. Parse only: the override detector reads the Codex config as TOML.
toml = { version = "1", default-features = false, features = ["parse"] }
# Already in Cargo.lock through the Tauri build (ADR-17 17b, bhishma Q6): gzip and sha512 for a verified npm tarball.
flate2 = "1"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }

[profile.release]
lto = true
strip = true
